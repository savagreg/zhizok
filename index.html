<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Жизок — Итог дня</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #171310;
    --card: #201a17;
    --card2: #2b2320;
    --text: #ede7e1;
    --muted: #a1968e;
    --accent: #cf9188;
    --accent-ink: #1d1310;
    --accent-dark: #382723;
    --line: #342b26;
    --red: #c47b6f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 22px 16px 40px;
    max-width: 560px;
    margin: 0 auto;
  }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: 26px; font-weight: 700; margin-bottom: 6px; letter-spacing: .2px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 18px 16px;
    margin-bottom: 14px;
    opacity: 0;
    transform: translateY(16px);
    animation: rise .5s cubic-bezier(.22,.9,.36,1) forwards;
  }
  @keyframes rise { to { opacity: 1; transform: none; } }
  h1, .sub { opacity: 0; animation: rise .5s ease forwards; }
  .sub { animation-delay: .08s; }
  #done { animation: rise .45s ease forwards; }
  .q { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .hint { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }
  .scale { display: flex; flex-wrap: wrap; gap: 6px; }
  .scale button {
    flex: 0 0 calc(20% - 5px);
    height: 44px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--card2);
    color: var(--text);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
  }
  .scale button.sel { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button {
    padding: 11px 16px;
    border-radius: 24px;
    border: 1px solid var(--line);
    background: var(--card2);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    transition: all .15s;
  }
  .chips button.sel { background: var(--accent-dark); border-color: var(--accent); color: var(--accent); }
  .chips button.theme { border-style: dashed; }
  .chips button.theme.has { border-style: solid; border-color: var(--accent); }
  .chips button.back { background: transparent; color: var(--muted); }
  .chips button.nav { background: transparent; border-color: var(--line); color: var(--accent); }
  textarea {
    width: 100%;
    min-height: 84px;
    background: var(--card2);
    border: 1px solid var(--line);
    border-radius: 14px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    padding: 12px;
    resize: vertical;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .submit {
    width: 100%;
    height: 54px;
    border-radius: 18px;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 17px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    margin-top: 8px;
  }
  .submit:disabled { opacity: .5; }
  .err { color: var(--red); font-size: 13.5px; text-align: center; margin-top: 10px; display: none; }
  .banner {
    display: none;
    background: var(--accent-dark);
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 16px;
    padding: 12px 16px;
    font-size: 14px;
    margin-bottom: 16px;
    cursor: pointer;
  }
  #done { display: none; text-align: center; padding-top: 90px; }
  #done .big { font-size: 52px; margin-bottom: 16px; }
  #done h2 { font-family: Georgia, "Times New Roman", serif; font-size: 22px; margin-bottom: 8px; }
  #done p { color: var(--muted); font-size: 15px; }
</style>
</head>
<body>

<div id="main">
  <h1 id="greet">Как прошёл день?</h1>
  <div class="sub" id="dateline">Пара минут — и готово. Запись за:</div>
  <div class="chips" id="daybar" style="margin-bottom:12px"></div>
  <div class="chips" style="margin-bottom:16px"><button class="nav" id="toMonthly">Итоги месяца →</button></div>
  <div class="banner" id="monthBanner">Месяц заканчивается — самое время подвести итог →</div>
  <div id="form"></div>
  <button class="submit" id="send" onclick="submitForm()">Сохранить день</button>
  <div class="err" id="err">Заполни, пожалуйста, все шкалы и «Что беспокоило»</div>
</div>

<div id="monthlyView" style="display:none">
  <h1>Итоги месяца</h1>
  <div class="sub" id="monthLine"></div>
  <div class="chips" style="margin-bottom:18px"><button class="back" id="toDay">← Вернуться к дню</button></div>
  <div id="monthlyForm"></div>
  <button class="submit" id="sendMonthly">Сохранить итог месяца</button>
  <div class="err" id="merr">Поставь хотя бы оценку месяца</div>
</div>

<div id="done">
  <div class="big">🌿</div>
  <h2>День записан</h2>
  <p>Спасибо. Увидимся завтра.</p>
</div>

<script>
const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLScHqljL698DGsNmir_faD6NED3xI06AO3XWW9hojHPWC2YL0w/formResponse";

// Вопрос-дата «За какой день эта запись?» (добавлен 04.08.2026).
const DATE_ENTRY = 1386198610;

// «Итог месяца» — отдельный экран, отправляется отдельно от дня.
const MONTHLY = {
  scale: { id: 1682978531, title: "Оценка месяца", hint: "1 — провальный, 10 — лучший" },
  texts: [
    { id: 611915943,  title: "Чем запомнится месяц?", ph: "Главные события, люди, моменты — и в работе, и в личном…" },
    { id: 2019043474, title: "Чем горжусь за месяц?", ph: "Достижения, закрытые гештальты, преодоления…" },
    { id: 159415904,  title: "Что забирало силы?", ph: "Что мешало, бесило, выматывало…" }
  ],
  checks: { id: 1466845971, title: "Где был прогресс?",
    opts: ["Финансы", "Контент и соцсети", "Здоровье", "Нетворкинг",
           "Саморазвитие", "Путешествия", "Личное", "Проекты"] },
  focus: { id: 1304395212, title: "Фокус следующего месяца?", ph: "1–3 главные цели…" }
};

const SCALES = [
  { id: 1251479055, title: "Оценка дня", hint: "1 — худший день, 10 — лучший", from: 1, to: 10 },
  { id: 352003469,  title: "Энергия и продуктивность", hint: "1 — без сил и день впустую, 10 — полон сил и всё успел", from: 1, to: 10 },
  { id: 1656073886, title: "Стресс", hint: "1 — спокойный день, 10 — очень напряженный", from: 1, to: 10 },
  { id: 620105065,  title: "Качество сна прошлой ночью", hint: "1 — ужасно спал, 10 — отлично выспался", from: 1, to: 10 }
];

const DRILLS = [
  { id: 119850202, title: "Что беспокоило сегодня?", hint: "Выбери тему, внутри отметь нужное", required: true,
    quick: ["Ничего"],
    themes: [
      { label: "Живот и ЖКТ", opts: ["Дискомфорт/покалывание справа под ребром", "ЖКТ: тяжесть, вздутие"] },
      { label: "Голова", opts: ["Головная боль"] },
      { label: "Тело", opts: ["Спина", "Стопы"] }
    ] },
  { id: 768640494, title: "Общее по дню", hint: "Выбери тему, внутри отметь нужное", required: false,
    quick: [],
    themes: [
      { label: "Еда и напитки", opts: ["Кофе", "Жирное / жареное", "Поздний прием пищи"] },
      { label: "Активность", opts: ["5000+ шагов", "Спорт", "Время на улице"] }
    ],
    withText: { id: 459596409, label: "Что хочется выделить?", ph: "Что запомнилось, что порадовало, что тянуло вниз — пара строк…" } }
];

const answers = { scales: {}, checks: {}, texts: {}, others: {} };
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const haptic = () => { if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); };

const months = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const monthsNom = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];

// ---- Правило 4 утра + выбор дня ----
const effToday = new Date(Date.now() - 4 * 3600 * 1000);
effToday.setHours(0, 0, 0, 0);
const yestD = new Date(effToday); yestD.setDate(yestD.getDate() - 1);
let targetDate = new Date(effToday);
const fmtD = d => d.getDate() + " " + months[d.getMonth()];

const daybar = document.getElementById("daybar");
let dayMode = "today";
function renderDaybar() {
  daybar.innerHTML = "";
  const mk = (label, m, d) => {
    const b = document.createElement("button");
    b.textContent = label;
    if (dayMode === m) b.classList.add("sel");
    b.onclick = () => { dayMode = m; targetDate = new Date(d); haptic(); renderDaybar(); };
    daybar.appendChild(b);
  };
  mk("Сегодня · " + fmtD(effToday), "today", effToday);
  mk("Вчера · " + fmtD(yestD), "yest", yestD);
}
renderDaybar();

// ---- Переключение экранов ----
const mainView = document.getElementById("main");
const monthlyView = document.getElementById("monthlyView");
function showMonthly() {
  mainView.style.display = "none";
  monthlyView.style.display = "block";
  document.getElementById("monthLine").textContent =
    monthsNom[targetDate.getMonth()] + " " + targetDate.getFullYear() + " — не спеши, это надолго останется";
  window.scrollTo(0, 0);
  haptic();
}
function showDay() {
  monthlyView.style.display = "none";
  mainView.style.display = "block";
  window.scrollTo(0, 0);
  haptic();
}
document.getElementById("toMonthly").onclick = showMonthly;
document.getElementById("toDay").onclick = showDay;

// Баннер в последние 2 дня месяца
const lastDayOfMonth = new Date(effToday.getFullYear(), effToday.getMonth() + 1, 0).getDate();
if (effToday.getDate() >= lastDayOfMonth - 1) {
  const bn = document.getElementById("monthBanner");
  bn.style.display = "block";
  bn.onclick = showMonthly;
}

const root = document.getElementById("form");

let cardIndex = 0;
function stagger(card) {
  card.style.animationDelay = Math.min(cardIndex * 70, 600) + "ms";
  cardIndex++;
}

SCALES.forEach(s => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = '<div class="q">' + s.title + '</div><div class="hint">' + s.hint + '</div>';
  const row = document.createElement("div");
  row.className = "scale";
  for (let v = s.from; v <= s.to; v++) {
    const b = document.createElement("button");
    b.textContent = v;
    b.onclick = () => {
      answers.scales[s.id] = v;
      row.querySelectorAll("button").forEach(x => x.classList.remove("sel"));
      b.classList.add("sel");
      haptic();
    };
    row.appendChild(b);
  }
  card.appendChild(row);
  stagger(card);
  root.appendChild(card);
});

DRILLS.forEach(c => {
  answers.checks[c.id] = new Set();
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = '<div class="q">' + c.title + '</div><div class="hint">' + c.hint + '</div>';
  const wrap = document.createElement("div");
  wrap.className = "chips";

  const oi = document.createElement("input");
  oi.type = "text";
  oi.placeholder = "Свой вариант";
  oi.style.cssText = "display:none;width:100%;margin-top:10px;background:var(--card2);border:1px solid var(--line);border-radius:14px;color:var(--text);font-size:15px;font-family:inherit;padding:11px 12px;outline:none;";
  oi.oninput = () => { answers.others[c.id] = oi.value.trim(); };
  let otherOn = false;

  const set = answers.checks[c.id];
  const allOpts = c.themes.flatMap(t => t.opts);

  function themeCount(t) { return t.opts.filter(o => set.has(o)).length; }

  function showThemes() {
    wrap.innerHTML = "";
    c.quick.forEach(o => {
      const b = document.createElement("button");
      b.textContent = o;
      if (set.has(o)) b.classList.add("sel");
      b.onclick = () => {
        if (set.has(o)) { set.delete(o); }
        else if (o === "Ничего") {
          allOpts.forEach(x => set.delete(x));
          set.add(o);
        } else { set.add(o); }
        haptic();
        showThemes();
      };
      wrap.appendChild(b);
    });
    c.themes.forEach(t => {
      const n = themeCount(t);
      const b = document.createElement("button");
      b.className = "theme" + (n > 0 ? " has" : "");
      b.textContent = t.label + (n > 0 ? " · " + n : "");
      b.onclick = () => { haptic(); showTheme(t); };
      wrap.appendChild(b);
    });
    const ob = document.createElement("button");
    ob.textContent = "Другое…";
    if (otherOn) ob.classList.add("sel");
    ob.onclick = () => {
      otherOn = !otherOn;
      oi.style.display = otherOn ? "block" : "none";
      if (otherOn) oi.focus(); else { oi.value = ""; answers.others[c.id] = ""; }
      haptic();
      showThemes();
    };
    wrap.appendChild(ob);
  }

  function showTheme(t) {
    wrap.innerHTML = "";
    const back = document.createElement("button");
    back.className = "back";
    back.textContent = "← Назад";
    back.onclick = () => { haptic(); showThemes(); };
    wrap.appendChild(back);
    t.opts.forEach(o => {
      const b = document.createElement("button");
      b.textContent = o;
      if (set.has(o)) b.classList.add("sel");
      b.onclick = () => {
        if (set.has(o)) { set.delete(o); b.classList.remove("sel"); }
        else {
          set.delete("Ничего");
          set.add(o);
          b.classList.add("sel");
        }
        haptic();
      };
      wrap.appendChild(b);
    });
  }

  showThemes();
  card.appendChild(wrap);
  card.appendChild(oi);

  if (c.withText) {
    const tl = document.createElement("div");
    tl.className = "q";
    tl.style.cssText = "margin-top:16px;margin-bottom:8px;";
    tl.textContent = c.withText.label;
    const ta = document.createElement("textarea");
    ta.placeholder = c.withText.ph;
    ta.oninput = () => { answers.texts[c.withText.id] = ta.value; };
    card.appendChild(tl);
    card.appendChild(ta);
  }

  stagger(card);
  root.appendChild(card);
});

// ---- Экран «Итоги месяца» ----
const mAns = { scale: undefined, texts: {}, checks: new Set(), other: "" };
const mroot = document.getElementById("monthlyForm");

{
  const card = document.createElement("div");
  card.className = "card";
  card.style.animation = "none"; card.style.opacity = 1; card.style.transform = "none";
  card.innerHTML = '<div class="q">' + MONTHLY.scale.title + '</div><div class="hint">' + MONTHLY.scale.hint + '</div>';
  const row = document.createElement("div");
  row.className = "scale";
  for (let v = 1; v <= 10; v++) {
    const b = document.createElement("button");
    b.textContent = v;
    b.onclick = () => {
      mAns.scale = v;
      row.querySelectorAll("button").forEach(x => x.classList.remove("sel"));
      b.classList.add("sel");
      haptic();
    };
    row.appendChild(b);
  }
  card.appendChild(row);
  mroot.appendChild(card);
}

{
  const card = document.createElement("div");
  card.className = "card";
  card.style.animation = "none"; card.style.opacity = 1; card.style.transform = "none";
  card.innerHTML = '<div class="q">' + MONTHLY.checks.title + '</div><div class="hint">Отметь сферы, где реально сдвинулся</div>';
  const wrap = document.createElement("div");
  wrap.className = "chips";
  MONTHLY.checks.opts.forEach(o => {
    const b = document.createElement("button");
    b.textContent = o;
    b.onclick = () => {
      if (mAns.checks.has(o)) { mAns.checks.delete(o); b.classList.remove("sel"); }
      else { mAns.checks.add(o); b.classList.add("sel"); }
      haptic();
    };
    wrap.appendChild(b);
  });
  const moi = document.createElement("input");
  moi.type = "text";
  moi.placeholder = "Свой вариант";
  moi.style.cssText = "display:none;width:100%;margin-top:10px;background:var(--card2);border:1px solid var(--line);border-radius:14px;color:var(--text);font-size:15px;font-family:inherit;padding:11px 12px;outline:none;box-sizing:border-box;";
  moi.oninput = () => { mAns.other = moi.value.trim(); };
  let mOtherOn = false;
  const ob = document.createElement("button");
  ob.textContent = "Другое…";
  ob.onclick = () => {
    mOtherOn = !mOtherOn;
    ob.classList.toggle("sel", mOtherOn);
    moi.style.display = mOtherOn ? "block" : "none";
    if (mOtherOn) moi.focus(); else { moi.value = ""; mAns.other = ""; }
    haptic();
  };
  wrap.appendChild(ob);
  card.appendChild(wrap);
  card.appendChild(moi);
  mroot.appendChild(card);
}

MONTHLY.texts.concat([MONTHLY.focus]).forEach(t => {
  const card = document.createElement("div");
  card.className = "card";
  card.style.animation = "none"; card.style.opacity = 1; card.style.transform = "none";
  card.innerHTML = '<div class="q" style="margin-bottom:10px">' + t.title + '</div>';
  const ta = document.createElement("textarea");
  ta.placeholder = t.ph;
  ta.oninput = () => { mAns.texts[t.id] = ta.value; };
  card.appendChild(ta);
  mroot.appendChild(card);
});

// ---- Отправка ----
function buildAndPost(fill) {
  const f = document.createElement("form");
  f.action = FORM_URL;
  f.method = "POST";
  f.target = "hidden_iframe";
  f.style.display = "none";
  const add = (name, value) => {
    const i = document.createElement("input");
    i.type = "hidden"; i.name = name; i.value = value;
    f.appendChild(i);
  };
  fill(add);
  add("entry." + DATE_ENTRY + "_year", targetDate.getFullYear());
  add("entry." + DATE_ENTRY + "_month", targetDate.getMonth() + 1);
  add("entry." + DATE_ENTRY + "_day", targetDate.getDate());
  const iframe = document.createElement("iframe");
  iframe.name = "hidden_iframe";
  iframe.style.display = "none";
  document.body.appendChild(iframe);
  document.body.appendChild(f);
  f.submit();
}

function finish(h2, p) {
  document.getElementById("main").style.display = "none";
  document.getElementById("monthlyView").style.display = "none";
  document.getElementById("done").style.display = "block";
  if (h2) document.querySelector("#done h2").textContent = h2;
  if (p) document.querySelector("#done p").textContent = p;
  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
  if (tg) setTimeout(() => tg.close(), 2500);
}

function submitForm() {
  const allScales = SCALES.every(s => answers.scales[s.id] !== undefined);
  const reqChecks = DRILLS.filter(c => c.required).every(c => answers.checks[c.id].size > 0 || (answers.others[c.id] || "").length > 0);
  const err = document.getElementById("err");
  if (!allScales || !reqChecks) {
    err.style.display = "block";
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
    return;
  }
  err.style.display = "none";
  document.getElementById("send").disabled = true;

  buildAndPost(add => {
    SCALES.forEach(s => add("entry." + s.id, answers.scales[s.id]));
    DRILLS.forEach(c => {
      answers.checks[c.id].forEach(v => add("entry." + c.id, v));
      if ((answers.others[c.id] || "").length > 0) {
        add("entry." + c.id, "__other_option__");
        add("entry." + c.id + ".other_option_response", answers.others[c.id]);
      }
      if (c.withText && (answers.texts[c.withText.id] || "").length > 0) {
        add("entry." + c.withText.id, answers.texts[c.withText.id]);
      }
    });
  });

  setTimeout(() => {
    if (+targetDate !== +effToday) {
      finish("День записан задним числом", "Сохранил за " + fmtD(targetDate) + ". Спасибо.");
    } else {
      finish(null, null);
    }
  }, 1200);
}

document.getElementById("sendMonthly").onclick = () => {
  const merr = document.getElementById("merr");
  if (mAns.scale === undefined) {
    merr.style.display = "block";
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
    return;
  }
  merr.style.display = "none";
  document.getElementById("sendMonthly").disabled = true;

  buildAndPost(add => {
    add("entry." + MONTHLY.scale.id, mAns.scale);
    mAns.checks.forEach(v => add("entry." + MONTHLY.checks.id, v));
    if (mAns.other.length > 0) {
      add("entry." + MONTHLY.checks.id, "__other_option__");
      add("entry." + MONTHLY.checks.id + ".other_option_response", mAns.other);
    }
    MONTHLY.texts.concat([MONTHLY.focus]).forEach(t => {
      if ((mAns.texts[t.id] || "").trim().length > 0) add("entry." + t.id, mAns.texts[t.id]);
    });
  });

  setTimeout(() => {
    finish("Итог месяца записан",
      monthsNom[targetDate.getMonth()] + " " + targetDate.getFullYear() + " подведён. Спасибо.");
  }, 1200);
};
</script>
