<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Жизок — Итог дня</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #12171a;
    --card: #1b2226;
    --card2: #222b30;
    --text: #e9edee;
    --muted: #93a09f;
    --accent: #7fa591;
    --accent-dark: #24352d;
    --line: #2b3539;
    --red: #c47b6f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px 16px 40px;
    max-width: 560px;
    margin: 0 auto;
  }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .q { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .hint { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }
  .scale { display: flex; flex-wrap: wrap; gap: 6px; }
  .scale button {
    flex: 1 0 calc(20% - 6px);
    min-width: 44px;
    height: 44px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--card2);
    color: var(--text);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
  }
  .scale button.sel { background: var(--accent); border-color: var(--accent); color: #0f1512; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button {
    padding: 10px 14px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: var(--card2);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    transition: all .15s;
  }
  .chips button.sel { background: var(--accent-dark); border-color: var(--accent); color: var(--accent); }
  textarea {
    width: 100%;
    min-height: 76px;
    background: var(--card2);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    padding: 12px;
    resize: vertical;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .submit {
    width: 100%;
    height: 54px;
    border-radius: 16px;
    border: none;
    background: var(--accent);
    color: #0f1512;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
  }
  .submit:disabled { opacity: .5; }
  .err { color: var(--red); font-size: 13.5px; text-align: center; margin-top: 10px; display: none; }
  #done { display: none; text-align: center; padding-top: 90px; }
  #done .big { font-size: 52px; margin-bottom: 16px; }
  #done h2 { font-size: 21px; margin-bottom: 8px; }
  #done p { color: var(--muted); font-size: 15px; }
</style>
</head>
<body>

<div id="main">
  <h1 id="greet">Как прошел день?</h1>
  <div class="sub" id="dateline"></div>
  <div id="form"></div>
  <button class="submit" id="send" onclick="submitForm()">Сохранить день</button>
  <div class="err" id="err">Заполни, пожалуйста, все шкалы и «Что беспокоило»</div>
</div>

<div id="done">
  <div class="big">🌿</div>
  <h2>День записан</h2>
  <p>Спасибо. Увидимся завтра.</p>
</div>

<script>
const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLScHqljL698DGsNmir_faD6NED3xI06AO3XWW9hojHPWC2YL0w/formResponse";

const SCALES = [
  { id: 1251479055, title: "Оценка дня", hint: "1 — худший день, 10 — лучший", from: 1, to: 10 },
  { id: 352003469,  title: "Энергия", hint: "1 — совсем без сил, 10 — полон энергии", from: 1, to: 10 },
  { id: 1656073886, title: "Стресс", hint: "1 — спокойный день, 10 — очень напряженный", from: 1, to: 10 },
  { id: 505604006,  title: "Тревога о здоровье", hint: "0 — не думал об этом, 10 — сильно тревожился", from: 0, to: 10 },
  { id: 620105065,  title: "Качество сна прошлой ночью", hint: "1 — ужасно спал, 10 — отлично выспался", from: 1, to: 10 },
  { id: 1194878652, title: "Продуктивность в работе", hint: "1 — день впустую, 10 — очень продуктивно", from: 1, to: 10 }
];
const CHECKS = [
  { id: 119850202, title: "Что беспокоило сегодня?", hint: "Можно несколько", required: true,
    opts: ["Ничего","Дискомфорт/покалывание справа под ребром","ЖКТ: тяжесть, вздутие","Головная боль","Спина / стопы","Признаки простуды"] },
  { id: 768640494, title: "Что было сегодня?", hint: "Отметь всё, что было", required: false,
    opts: ["Кофе","Жирное / жареное","5000+ шагов","Силовая тренировка","Алкоголь","Поздний прием пищи","Лег после 01:00","Весь день за экраном","Время на улице","Общение с близкими"] }
];
const TEXTS = [
  { id: 459596409,  title: "Что понравилось / запомнилось / зарядило?", ph: "Пара строк, необязательно…" },
  { id: 1747181437, title: "Что не понравилось / тянуло вниз?", ph: "Пара строк, необязательно…" }
];

const answers = { scales: {}, checks: {}, texts: {} };
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const months = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const now = new Date();
document.getElementById("dateline").textContent = "Сегодня " + now.getDate() + " " + months[now.getMonth()] + ", пара минут — и готово";

const root = document.getElementById("form");

SCALES.forEach(s => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = '<div class="q">' + s.title + '</div><div class="hint">' + s.hint + '</div>';
  const row = document.createElement("div");
  row.className = "scale";
  for (let v = s.from; v <= s.to; v++) {
    const b = document.createElement("button");
    b.textContent = v;
    b.onclick = () => {
      answers.scales[s.id] = v;
      row.querySelectorAll("button").forEach(x => x.classList.remove("sel"));
      b.classList.add("sel");
      if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    };
    row.appendChild(b);
  }
  card.appendChild(row);
  root.appendChild(card);
});

CHECKS.forEach(c => {
  answers.checks[c.id] = new Set();
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = '<div class="q">' + c.title + '</div><div class="hint">' + c.hint + '</div>';
  const wrap = document.createElement("div");
  wrap.className = "chips";
  c.opts.forEach(o => {
    const b = document.createElement("button");
    b.textContent = o;
    b.onclick = () => {
      const set = answers.checks[c.id];
      if (set.has(o)) { set.delete(o); b.classList.remove("sel"); }
      else {
        if (o === "Ничего") { set.clear(); wrap.querySelectorAll("button").forEach(x => x.classList.remove("sel")); }
        else if (set.has("Ничего")) { set.delete("Ничего"); wrap.querySelectorAll("button").forEach(x => { if (x.textContent === "Ничего") x.classList.remove("sel"); }); }
        set.add(o); b.classList.add("sel");
      }
      if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    };
    wrap.appendChild(b);
  });
  card.appendChild(wrap);
  root.appendChild(card);
});

TEXTS.forEach(t => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = '<div class="q" style="margin-bottom:10px">' + t.title + '</div>';
  const ta = document.createElement("textarea");
  ta.placeholder = t.ph;
  ta.oninput = () => { answers.texts[t.id] = ta.value; };
  card.appendChild(ta);
  root.appendChild(card);
});

function submitForm() {
  const allScales = SCALES.every(s => answers.scales[s.id] !== undefined);
  const reqChecks = CHECKS.filter(c => c.required).every(c => answers.checks[c.id].size > 0);
  const err = document.getElementById("err");
  if (!allScales || !reqChecks) {
    err.style.display = "block";
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
    return;
  }
  err.style.display = "none";
  document.getElementById("send").disabled = true;

  const f = document.createElement("form");
  f.action = FORM_URL;
  f.method = "POST";
  f.target = "hidden_iframe";
  f.style.display = "none";
  const add = (name, value) => {
    const i = document.createElement("input");
    i.type = "hidden"; i.name = name; i.value = value;
    f.appendChild(i);
  };
  SCALES.forEach(s => add("entry." + s.id, answers.scales[s.id]));
  CHECKS.forEach(c => answers.checks[c.id].forEach(v => add("entry." + c.id, v)));
  TEXTS.forEach(t => { if (answers.texts[t.id]) add("entry." + t.id, answers.texts[t.id]); });

  const iframe = document.createElement("iframe");
  iframe.name = "hidden_iframe";
  iframe.style.display = "none";
  document.body.appendChild(iframe);
  document.body.appendChild(f);
  f.submit();

  setTimeout(() => {
    document.getElementById("main").style.display = "none";
    document.getElementById("done").style.display = "block";
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    if (tg) setTimeout(() => tg.close(), 2500);
  }, 1200);
}
</script>
</body>
</html>
