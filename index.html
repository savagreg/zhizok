<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Жизок — Итог дня</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #12171a;
    --card: #1b2226;
    --card2: #222b30;
    --text: #e9edee;
    --muted: #93a09f;
    --accent: #7fa591;
    --accent-dark: #24352d;
    --line: #2b3539;
    --red: #c47b6f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px 16px 40px;
    max-width: 560px;
    margin: 0 auto;
  }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  h1, .sub { opacity: 0; animation: rise .5s ease forwards; }
  .sub { animation-delay: .08s; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  .section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    margin-bottom: 12px;
    overflow: hidden;
    opacity: 0;
    transform: translateY(16px);
    animation: rise .5s cubic-bezier(.22,.9,.36,1) forwards;
  }
  .sechead {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: none;
    border: none;
    color: var(--text);
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    padding: 16px;
    cursor: pointer;
  }
  .secstate { font-size: 13px; font-weight: 600; color: var(--muted); transition: color .2s; }
  .secstate.done { color: var(--accent); }
  .secbody { display: none; padding: 0 14px 14px; }
  .section.open .secbody { display: block; }

  .card {
    background: var(--card2);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .q { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .hint { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
  .qrow { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .bigval { font-size: 24px; font-weight: 700; color: var(--muted); min-width: 40px; text-align: right; transition: color .2s; }
  .bigval.set { color: var(--accent); }
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 44px;
    background: transparent;
    margin-top: 4px;
    --p: 50%;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 10px;
    border-radius: 6px;
    background: linear-gradient(90deg, var(--fillc, var(--bg)) var(--p), var(--bg) var(--p));
    border: 1px solid var(--line);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #e9edee;
    border: 3px solid var(--accent);
    margin-top: -11px;
    box-shadow: 0 2px 10px rgba(0,0,0,.45);
  }
  .minmax { display: flex; justify-content: space-between; color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button {
    padding: 10px 14px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    transition: all .15s;
  }
  .chips button.sel { background: var(--accent-dark); border-color: var(--accent); color: var(--accent); }
  textarea {
    width: 100%;
    min-height: 76px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    padding: 12px;
    resize: vertical;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .submit {
    width: 100%;
    height: 54px;
    border-radius: 16px;
    border: none;
    background: var(--accent);
    color: #0f1512;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
  }
  .submit:disabled { opacity: .5; }
  .err { color: var(--red); font-size: 13.5px; text-align: center; margin-top: 10px; display: none; }
  #done { display: none; text-align: center; padding-top: 90px; animation: rise .45s ease forwards; }
  #done .big { font-size: 52px; margin-bottom: 16px; }
  #done h2 { font-size: 21px; margin-bottom: 8px; }
  #done p { color: var(--muted); font-size: 15px; }
</style>
</head>
<body>

<div id="main">
  <h1 id="greet">Как прошел день?</h1>
  <div class="sub" id="dateline"></div>
  <div id="form"></div>
  <button class="submit" id="send" onclick="submitForm()">Сохранить день</button>
  <div class="err" id="err">Заполни, пожалуйста, все шкалы и «Что беспокоило»</div>
</div>

<div id="done">
  <div class="big">🌿</div>
  <h2>День записан</h2>
  <p>Спасибо. Увидимся завтра.</p>
</div>

<script>
const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLScHqljL698DGsNmir_faD6NED3xI06AO3XWW9hojHPWC2YL0w/formResponse";

const Q = {
  day:    { id: 1251479055, title: "Оценка дня", hint: "1 — худший день, 10 — лучший", from: 1, to: 10 },
  energy: { id: 352003469,  title: "Энергия", hint: "1 — совсем без сил, 10 — полон энергии", from: 1, to: 10 },
  stress: { id: 1656073886, title: "Стресс", hint: "1 — спокойный день, 10 — очень напряженный", from: 1, to: 10 },
  anx:    { id: 505604006,  title: "Тревога о здоровье", hint: "0 — не думал об этом, 10 — сильно тревожился", from: 0, to: 10 },
  sleep:  { id: 620105065,  title: "Качество сна прошлой ночью", hint: "1 — ужасно спал, 10 — отлично выспался", from: 1, to: 10 },
  work:   { id: 1194878652, title: "Продуктивность в работе", hint: "1 — день впустую, 10 — очень продуктивно", from: 1, to: 10 }
};
const SYMPTOMS = { id: 119850202, title: "Что беспокоило сегодня?", hint: "Можно несколько", required: true,
  opts: ["Ничего","Дискомфорт/покалывание справа под ребром","ЖКТ: тяжесть, вздутие","Головная боль","Спина / стопы","Признаки простуды"] };
const HABITS = { id: 768640494, title: "Что было сегодня?", hint: "Отметь всё, что было", required: false,
  opts: ["Кофе","Жирное / жареное","5000+ шагов","Силовая тренировка","Алкоголь","Поздний прием пищи","Лег после 01:00","Весь день за экраном","Время на улице"] };
const RELATIONS = { id: 768640494, title: "Общение", hint: "Было ли сегодня", required: false, noOther: true,
  opts: ["Общение с близкими"] };
const TEXTS = [
  { id: 459596409,  title: "Что понравилось / запомнилось / зарядило?", ph: "Пара строк, необязательно…" },
  { id: 1747181437, title: "Что не понравилось / тянуло вниз?", ph: "Пара строк, необязательно…" }
];

const answers = { scales: {}, checks: {}, texts: {}, others: {} };
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const months = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const now = new Date();
document.getElementById("dateline").textContent = "Сегодня " + now.getDate() + " " + months[now.getMonth()] + ", пара минут — и готово";

const root = document.getElementById("form");

function buildScale(s) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = '<div class="qrow"><div class="q">' + s.title + '</div><div class="bigval">—</div></div><div class="hint">' + s.hint + '</div>';
  const bigval = card.querySelector(".bigval");
  const r = document.createElement("input");
  r.type = "range"; r.min = s.from; r.max = s.to; r.step = 1;
  r.value = Math.round((s.from + s.to) / 2);
  const setFill = () => {
    const pct = (r.value - s.from) / (s.to - s.from) * 100;
    r.style.setProperty("--p", pct + "%");
  };
  setFill();
  r.addEventListener("input", () => {
    answers.scales[s.id] = +r.value;
    bigval.textContent = r.value;
    bigval.classList.add("set");
    r.style.setProperty("--fillc", "var(--accent)");
    setFill();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    refresh();
  });
  const mm = document.createElement("div");
  mm.className = "minmax";
  mm.innerHTML = "<span>" + s.from + "</span><span>" + s.to + "</span>";
  card.appendChild(r);
  card.appendChild(mm);
  return card;
}

function buildChips(c) {
  if (!answers.checks[c.id]) answers.checks[c.id] = new Set();
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = '<div class="q">' + c.title + '</div><div class="hint">' + c.hint + '</div>';
  const wrap = document.createElement("div");
  wrap.className = "chips";
  c.opts.forEach(o => {
    const b = document.createElement("button");
    b.textContent = o;
    b.onclick = () => {
      const set = answers.checks[c.id];
      if (set.has(o)) { set.delete(o); b.classList.remove("sel"); }
      else {
        if (o === "Ничего") { set.clear(); wrap.querySelectorAll("button").forEach(x => x.classList.remove("sel")); }
        else if (set.has("Ничего")) { set.delete("Ничего"); wrap.querySelectorAll("button").forEach(x => { if (x.textContent === "Ничего") x.classList.remove("sel"); }); }
        set.add(o); b.classList.add("sel");
      }
      if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
      refresh();
    };
    wrap.appendChild(b);
  });
  if (!c.noOther) {
    const ob = document.createElement("button");
    ob.textContent = "Другое…";
    const oi = document.createElement("input");
    oi.type = "text";
    oi.placeholder = "Свой вариант";
    oi.style.cssText = "display:none;width:100%;margin-top:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--text);font-size:15px;font-family:inherit;padding:11px 12px;outline:none;";
    oi.oninput = () => { answers.others[c.id] = oi.value.trim(); refresh(); };
    ob.onclick = () => {
      const on = oi.style.display === "none";
      oi.style.display = on ? "block" : "none";
      ob.classList.toggle("sel", on);
      if (on) oi.focus(); else { oi.value = ""; answers.others[c.id] = ""; }
      if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    };
    wrap.appendChild(ob);
    card.appendChild(wrap);
    card.appendChild(oi);
  } else {
    card.appendChild(wrap);
  }
  return card;
}

function buildText(t) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = '<div class="q" style="margin-bottom:10px">' + t.title + '</div>';
  const ta = document.createElement("textarea");
  ta.placeholder = t.ph;
  ta.oninput = () => { answers.texts[t.id] = ta.value; refresh(); };
  card.appendChild(ta);
  return card;
}

const scalesDone = ids => ids.every(id => answers.scales[id] !== undefined);
const symptomsDone = () => (answers.checks[SYMPTOMS.id] && answers.checks[SYMPTOMS.id].size > 0) || (answers.others[SYMPTOMS.id] || "").length > 0;

const SECTIONS = [
  { key: "day", title: "🌅 День", cards: () => [buildScale(Q.day), buildScale(Q.energy)],
    total: 2, count: () => [Q.day.id, Q.energy.id].filter(id => answers.scales[id] !== undefined).length,
    done: () => scalesDone([Q.day.id, Q.energy.id]) },
  { key: "work", title: "💼 Работа", cards: () => [buildScale(Q.work), buildScale(Q.stress)],
    total: 2, count: () => [Q.work.id, Q.stress.id].filter(id => answers.scales[id] !== undefined).length,
    done: () => scalesDone([Q.work.id, Q.stress.id]) },
  { key: "health", title: "🫀 Здоровье", cards: () => [buildScale(Q.anx), buildScale(Q.sleep), buildChips(SYMPTOMS)],
    total: 3, count: () => [Q.anx.id, Q.sleep.id].filter(id => answers.scales[id] !== undefined).length + (symptomsDone() ? 1 : 0),
    done: () => scalesDone([Q.anx.id, Q.sleep.id]) && symptomsDone() },
  { key: "habits", title: "🚶 Привычки", cards: () => [buildChips(HABITS)],
    total: null, count: () => (answers.checks[HABITS.id] ? answers.checks[HABITS.id].size : 0),
    done: () => answers.checks[HABITS.id] && Array.from(answers.checks[HABITS.id]).some(v => HABITS.opts.includes(v)) },
  { key: "rel", title: "👥 Отношения", cards: () => [buildChips(RELATIONS)],
    total: null, count: () => (answers.checks[RELATIONS.id] && answers.checks[RELATIONS.id].has("Общение с близкими")) ? 1 : 0,
    done: () => answers.checks[RELATIONS.id] && answers.checks[RELATIONS.id].has("Общение с близкими") },
  { key: "mind", title: "📝 Мысли", cards: () => TEXTS.map(buildText),
    total: null, count: () => TEXTS.filter(t => (answers.texts[t.id] || "").length > 0).length,
    done: () => TEXTS.some(t => (answers.texts[t.id] || "").length > 0) }
];

const secEls = [];
SECTIONS.forEach((s, i) => {
  const sec = document.createElement("div");
  sec.className = "section" + (i === 0 ? " open" : "");
  sec.style.animationDelay = (i * 80) + "ms";
  const head = document.createElement("button");
  head.className = "sechead";
  head.innerHTML = '<span>' + s.title + '</span><span class="secstate"></span>';
  head.onclick = () => {
    sec.classList.toggle("open");
    if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
  };
  const body = document.createElement("div");
  body.className = "secbody";
  s.cards().forEach(c => body.appendChild(c));
  sec.appendChild(head);
  sec.appendChild(body);
  root.appendChild(sec);
  secEls.push(sec);
});

const autoOpened = new Set([0]);
function refresh() {
  SECTIONS.forEach((s, i) => {
    const state = secEls[i].querySelector(".secstate");
    const done = s.done();
    if (s.total) {
      state.textContent = s.count() + "/" + s.total;
    } else {
      state.textContent = s.count() > 0 ? "✓" : "";
    }
    state.classList.toggle("done", !!done);
    if (done && i + 1 < SECTIONS.length && !autoOpened.has(i + 1)) {
      autoOpened.add(i + 1);
      const next = secEls[i + 1];
      if (!next.classList.contains("open")) {
        next.classList.add("open");
        setTimeout(() => next.scrollIntoView({ behavior: "smooth", block: "start" }), 300);
      }
    }
  });
}
refresh();

function submitForm() {
  const allScales = Object.values(Q).every(s => answers.scales[s.id] !== undefined);
  const err = document.getElementById("err");
  if (!allScales || !symptomsDone()) {
    err.style.display = "block";
    secEls.forEach((el, i) => { if (!SECTIONS[i].done() && (SECTIONS[i].total || SECTIONS[i].key === "health")) el.classList.add("open"); });
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
    return;
  }
  err.style.display = "none";
  document.getElementById("send").disabled = true;

  const f = document.createElement("form");
  f.action = FORM_URL;
  f.method = "POST";
  f.target = "hidden_iframe";
  f.style.display = "none";
  const add = (name, value) => {
    const i = document.createElement("input");
    i.type = "hidden"; i.name = name; i.value = value;
    f.appendChild(i);
  };
  Object.values(Q).forEach(s => add("entry." + s.id, answers.scales[s.id]));
  [SYMPTOMS.id, HABITS.id].forEach(id => {
    (answers.checks[id] || new Set()).forEach(v => add("entry." + id, v));
    if ((answers.others[id] || "").length > 0) {
      add("entry." + id, "__other_option__");
      add("entry." + id + ".other_option_response", answers.others[id]);
    }
  });
  TEXTS.forEach(t => { if (answers.texts[t.id]) add("entry." + t.id, answers.texts[t.id]); });

  const iframe = document.createElement("iframe");
  iframe.name = "hidden_iframe";
  iframe.style.display = "none";
  document.body.appendChild(iframe);
  document.body.appendChild(f);
  f.submit();

  setTimeout(() => {
    document.getElementById("main").style.display = "none";
    document.getElementById("done").style.display = "block";
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    if (tg) setTimeout(() => tg.close(), 2500);
  }, 1200);
}
</script>
</body>
</html>
